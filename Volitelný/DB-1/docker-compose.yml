version: "3.9"
services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  flask-app:
    build: ./app
    container_name: flask-app
    environment:
      MONGODB_URL: "mongodb://admin:secret@mongo:27017"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./app:/app

volumes:
  mongo_data:
